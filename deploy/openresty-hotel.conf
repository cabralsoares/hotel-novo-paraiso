# Exemplo de site (server block) do OpenResty/Nginx para o hotel.
# Se o nome hotelpousadanovoparaiso.gmsti.com JÁ TEM um site configurado apontando para o AC STORE,
# não crie outro: edite aquele e troque só o destino do proxy (proxy_pass) para http://127.0.0.1:3100.

server {
    listen 80;
    listen 443 ssl;
    server_name hotelpousadanovoparaiso.gmsti.com;

    # --- mantenha aqui as linhas de certificado SSL que o site já tem ---
    # ssl_certificate     /caminho/fullchain.pem;
    # ssl_certificate_key /caminho/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3100;   # <- era a porta do AC STORE; agora é a do hotel
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Atrás do Cloudflare, o IP verdadeiro do cliente vem em CF-Connecting-IP (o sistema já lê esse cabeçalho).
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_read_timeout 60s;
    }
}
